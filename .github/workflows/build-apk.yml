name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # This image ships with the Android SDK preinstalled.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - run: gradle :app:assembleRelease --no-daemon --stacktrace
      - run: mv app/build/outputs/apk/release/app-release.apk Compass.apk
      - uses: actions/upload-artifact@v4
        with:
          name: compass-apk
          path: Compass.apk
      # A release gives a direct .apk link that opens straight from the phone.
      - uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: build-${{ github.run_number }}
          name: Compass (build ${{ github.run_number }})
          make_latest: true
          files: Compass.apk
